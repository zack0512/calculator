<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沙特科學計算機</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* 自定義按鈕點擊效果與陰影 */
        .calc-btn {
            transition: all 0.1s ease;
        }
        .calc-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 min-h-screen flex items-center justify-center p-4">

    <!-- 計算機外框容器 -->
    <div class="bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 shadow-2xl rounded-3xl w-full max-w-md p-6 text-white">
        
        <!-- 標題與模式切換提示 -->
        <div class="flex justify-between items-center mb-4 px-1">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <span class="text-xs text-slate-400 font-semibold ml-1">沙特超高能計算機</span>
            </div>
            <!-- 角度制切換開關 (Deg / Rad) -->
            <button id="angleToggle" onclick="toggleAngleUnit()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded-full text-purple-300 font-medium transition border border-slate-600">
                DEG
            </button>
        </div>

        <!-- 顯示螢幕區域 -->
        <div class="bg-slate-950/80 border border-slate-700/50 rounded-2xl p-4 mb-6 text-right shadow-inner">
            <!-- 歷史運算式 -->
            <div id="history" class="text-slate-400 text-sm h-6 overflow-x-auto whitespace-nowrap tracking-wider font-mono"></div>
            <!-- 當前輸入與結果 -->
            <div id="display" class="text-3xl sm:text-4xl font-bold tracking-tight text-white overflow-x-auto whitespace-nowrap font-mono mt-1">0</div>
        </div>

        <!-- 按鍵面板網格 -->
        <div class="grid grid-cols-4 gap-3">
            
            <!-- 第一行：清除、倒退、次方、除法 -->
            <button onclick="clearAll()" class="calc-btn bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/30 py-3.5 rounded-xl font-semibold text-base shadow-sm">AC</button>
            <button onclick="backspace()" class="calc-btn bg-slate-700/50 hover:bg-slate-700 text-slate-300 border border-slate-600/50 py-3.5 rounded-xl font-semibold text-base shadow-sm">⌫</button>
            <button onclick="appendOperator('^')" class="calc-btn bg-slate-700/50 hover:bg-slate-700 text-purple-300 border border-slate-600/50 py-3.5 rounded-xl font-semibold text-base shadow-sm">x²</button>
            <button onclick="appendOperator('/')" class="calc-btn bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 border border-purple-500/30 py-3.5 rounded-xl font-semibold text-lg shadow-sm">÷</button>

            <!-- 第二行：三角函數 sin, cos, tan, 乘法 -->
            <button onclick="appendFunction('sin')" class="calc-btn bg-slate-700/30 hover:bg-slate-700/50 text-indigo-300 border border-slate-600/30 py-3.5 rounded-xl font-semibold text-sm shadow-sm">sin</button>
            <button onclick="appendFunction('cos')" class="calc-btn bg-slate-700/30 hover:bg-slate-700/50 text-indigo-300 border border-slate-600/30 py-3.5 rounded-xl font-semibold text-sm shadow-sm">cos</button>
            <button onclick="appendFunction('tan')" class="calc-btn bg-slate-700/30 hover:bg-slate-700/50 text-indigo-300 border border-slate-600/30 py-3.5 rounded-xl font-semibold text-sm shadow-sm">tan</button>
            <button onclick="appendOperator('*')" class="calc-btn bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 border border-purple-500/30 py-3.5 rounded-xl font-semibold text-lg shadow-sm">×</button>

            <!-- 第三行：平方根、7、8、9、減法 -->
            <button onclick="appendFunction('sqrt')" class="calc-btn bg-slate-700/30 hover:bg-slate-700/50 text-indigo-300 border border-slate-600/30 py-3.5 rounded-xl font-semibold text-sm shadow-sm">√</button>
            <button onclick="appendNumber('7')" class="calc-btn bg-slate-700/70 hover:bg-slate-700 text-white py-3.5 rounded-xl font-semibold text-lg shadow-sm">7</button>
            <button onclick="appendNumber('8')" class="calc-btn bg-slate-700/70 hover:bg-slate-700 text-white py-3.5 rounded-xl font-semibold text-lg shadow-sm">8</button>
            <button onclick="appendNumber('9')" class="calc-btn bg-slate-700/70 hover:bg-slate-700 text-white py-3.5 rounded-xl font-semibold text-lg shadow-sm">9</button>
            
            <!-- 第四行：運算符減法 -->
            <button onclick="appendOperator('-')" class="calc-btn bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 border border-purple-500/30 py-3.5 rounded-xl font-semibold text-lg shadow-sm">-</button>
            <button onclick="appendNumber('4')" class="calc-btn bg-slate-700/70 hover:bg-slate-700 text-white py-3.5 rounded-xl font-semibold text-lg shadow-sm">4</button>
            <button onclick="appendNumber('5')" class="calc-btn bg-slate-700/70 hover:bg-slate-700 text-white py-3.5 rounded-xl font-semibold text-lg shadow-sm">5</button>
            <button onclick="appendNumber('6')" class="calc-btn bg-slate-700/70 hover:bg-slate-700 text-white py-3.5 rounded-xl font-semibold text-lg shadow-sm">6</button>

            <!-- 第五行：運算符加法 -->
            <button onclick="appendOperator('+')" class="calc-btn bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 border border-purple-500/30 py-3.5 rounded-xl font-semibold text-lg shadow-sm">+</button>
            <button onclick="appendNumber('1')" class="calc-btn bg-slate-700/70 hover:bg-slate-700 text-white py-3.5 rounded-xl font-semibold text-lg shadow-sm">1</button>
            <button onclick="appendNumber('2')" class="calc-btn bg-slate-700/70 hover:bg-slate-700 text-white py-3.5 rounded-xl font-semibold text-lg shadow-sm">2</button>
            <button onclick="appendNumber('3')" class="calc-btn bg-slate-700/70 hover:bg-slate-700 text-white py-3.5 rounded-xl font-semibold text-lg shadow-sm">3</button>

            <!-- 第六行：小數點、0、括號與等於 -->
            <button onclick="appendNumber('.')" class="calc-btn bg-slate-700/50 hover:bg-slate-700 text-slate-300 border border-slate-600/50 py-3.5 rounded-xl font-semibold text-lg shadow-sm">.</button>
            <button onclick="appendParentheses()" class="calc-btn bg-slate-700/50 hover:bg-slate-700 text-slate-300 border border-slate-600/50 py-3.5 rounded-xl font-semibold text-sm shadow-sm">( )</button>
            <button onclick="appendNumber('0')" class="calc-btn bg-slate-700/70 hover:bg-slate-700 text-white py-3.5 rounded-xl font-semibold text-lg shadow-sm">0</button>
            <button onclick="calculateResult()" class="calc-btn bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white py-3.5 rounded-xl font-semibold text-lg shadow-lg shadow-purple-900/40">=</button>
        </div>

    </div>

    <!-- 訊息提示對話框 (替代 alert) -->
    <div id="messageModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
            <h3 id="modalTitle" class="text-lg font-bold text-white mb-2">⚠️提醒</h3>
            <p id="modalMessage" class="text-slate-300 text-sm mb-6"></p>
            <button onclick="closeModal()" class="w-full bg-purple-600 hover:bg-purple-500 text-white py-2.5 rounded-xl font-semibold transition">確定</button>
        </div>
    </div>

    <!-- JavaScript 運算邏輯 -->
    <script>
        let currentInput = '0';
        let historyString = '';
        let isDegree = true; // 預設角度制 DEG

        const displayEl = document.getElementById('display');
        const historyEl = document.getElementById('history');
        const angleToggleEl = document.getElementById('angleToggle');

        // 更新顯示畫面
        function updateDisplay() {
            displayEl.textContent = currentInput;
            historyEl.textContent = historyString;
        }

        // 顯示自定義訊息框 (避免使用 alert)
        function showMessage(title, message) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('messageModal').classList.remove('hidden');
            document.getElementById('messageModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('messageModal').classList.remove('flex');
            document.getElementById('messageModal').classList.add('hidden');
        }

        // 切換角度/徑度
        function toggleAngleUnit() {
            isDegree = !isDegree;
            angleToggleEl.textContent = isDegree ? 'DEG' : 'RAD';
        }

        // 輸入數字
        function appendNumber(num) {
            if (currentInput === '0' && num !== '.') {
                currentInput = num;
            } else {
                currentInput += num;
            }
            updateDisplay();
        }

        // 輸入運算符
        function appendOperator(op) {
            const lastChar = currentInput.slice(-1);
            if ('+-*/^'.includes(lastChar)) {
                currentInput = currentInput.slice(0, -1) + op;
            } else {
                currentInput += op;
            }
            updateDisplay();
        }

        // 輸入函數 (sin, cos, tan, sqrt)
        function appendFunction(func) {
            if (currentInput === '0') {
                currentInput = func + '(';
            } else {
                currentInput += func + '(';
            }
            updateDisplay();
        }

        // 智慧型括號切換：自動計算未閉合的左括號數量來決定要補 '(' 還是 ')'
        function appendParentheses() {
            const openCount = (currentInput.match(/\(/g) || []).length;
            const closeCount = (currentInput.match(/\)/g) || []).length;

            if (openCount > closeCount) {
                // 如果有未閉合的左括號，點擊就自動補上右括號
                currentInput += ')';
            } else {
                // 否則新增一個左括號
                if (currentInput === '0' || '+-*/^('.includes(currentInput.slice(-1))) {
                    currentInput = currentInput === '0' ? '(' : currentInput + '(';
                } else {
                    currentInput += '*(';
                }
            }
            updateDisplay();
        }

        // 清除全部
        function clearAll() {
            currentInput = '0';
            historyString = '';
            updateDisplay();
        }

        // 倒退刪除一個字元
        function backspace() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        // 核心計算邏輯
        function calculateResult() {
            try {
                historyString = currentInput;
                let evaluatedStr = currentInput;

                // 自動補齊結尾缺少的括號
                const openCount = (evaluatedStr.match(/\(/g) || []).length;
                const closeCount = (evaluatedStr.match(/\)/g) || []).length;
                for (let i = 0; i < (openCount - closeCount); i++) {
                    evaluatedStr += ')';
                }

                // 替換運算符號為 JavaScript 可執行的語法
                evaluatedStr = evaluatedStr.replace(/sqrt\(/g, 'Math.sqrt(');
                evaluatedStr = evaluatedStr.replace(/\^/g, '**');

                // 處理三角函數 (sin, cos, tan)
                evaluatedStr = evaluatedStr.replace(/sin\(/g, isDegree ? 'Math.sin((Math.PI/180)*' : 'Math.sin(');
                evaluatedStr = evaluatedStr.replace(/cos\(/g, isDegree ? 'Math.cos((Math.PI/180)*' : 'Math.cos(');
                evaluatedStr = evaluatedStr.replace(/tan\(/g, isDegree ? 'Math.tan((Math.PI/180)*' : 'Math.tan(');

                // 執行安全運算
                let result = Function('"use strict"; return (' + evaluatedStr + ')')();

                if (!isFinite(result) || isNaN(result)) {
                    throw new Error("數學運算錯誤");
                }

                // 限制小數位數防止過長溢出
                result = Math.round(result * 1e10) / 1e10;

                currentInput = result.toString();
                updateDisplay();

            } catch (error) {
                showMessage("發生錯誤", "請檢查您的表達式格式是否正確或漏加括號。");
                currentInput = '0';
                updateDisplay();
            }
        }
    </script>
</body>
</html>
